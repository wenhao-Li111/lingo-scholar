name: Check Android companion
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The hosted runner already includes SDK 35. Avoid a second SDK bootstrap
      # and its external download dependency; fail clearly if the image changes.
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: node scripts/build-android.mjs --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-build-not-for-installation
          path: dist/android/lingo-scholar-unsigned.apk
