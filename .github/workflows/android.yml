name: Check Android companion
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: node scripts/build-android.mjs --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-build-not-for-installation
          path: dist/android/lingo-scholar-unsigned.apk
